name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate skill folders
        run: node scripts/validate-skills.mjs
      - name: Validate agent instructions folders
        run: node scripts/validate-agent-instructions.mjs
      - name: Validate prompt folders
        run: node scripts/validate-prompts.mjs
      - name: Validate Adaptive Card folders
        run: node scripts/validate-adaptive-cards.mjs

  scope:
    # The job name is a required check in the branch ruleset; it now covers skills, agent instructions, prompts and Adaptive Cards.
    name: One skill per PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that changed files touch at most one item
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          touched=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^(skills|agent-instructions|prompts|adaptive-cards)/[^/_][^/]*/' \
            | cut -d/ -f1,2 \
            | sort -u || true)
          count=$(printf '%s\n' "$touched" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "This pull request changes $count item folders:"
            printf '  - %s\n' $touched
            echo "Please open one pull request per item (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "OK: $count item folder(s) changed."

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the gallery
        run: npm run site:build
