<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1100" fill="none">
  <!-- Original decoration for the gallery's right edge: glass tiles cascading down. -->
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="o1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="o2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".55"/></pattern>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0v14" stroke="#fff" stroke-opacity=".45" fill="none"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity=".16"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <ellipse cx="240" cy="260" rx="200" ry="220" fill="#c4b5fd" opacity=".22" filter="url(#soft)"/>
  <ellipse cx="300" cy="820" rx="170" ry="200" fill="#7dd3fc" opacity=".2" filter="url(#soft)"/>

  <!-- top: warm fan -->
  <g filter="url(#sh)">
    <path d="M250 110 C 300 40, 400 40, 420 120 C 360 110, 300 130, 250 110 Z" fill="url(#o1)" opacity=".8"/>
    <path d="M250 110 C 300 40, 400 40, 420 120 C 360 110, 300 130, 250 110 Z" fill="url(#glass)"/>
    <g transform="translate(300 90) rotate(14) skewX(8)"><rect width="150" height="150" rx="75" fill="url(#o1)" opacity=".85"/><rect width="150" height="150" rx="75" fill="url(#glass)"/></g>
    <g transform="translate(330 220) rotate(10) skewX(10)"><rect width="90" height="60" rx="12" fill="url(#o2)" opacity=".8"/><rect width="90" height="60" rx="12" fill="url(#dots)"/><rect width="90" height="60" rx="12" fill="url(#glass)"/></g>
    <path d="M190 160 C 230 100, 290 110, 300 170 C 260 160, 220 180, 190 160 Z" fill="url(#o2)" opacity=".75"/>
    <path d="M190 160 C 230 100, 290 110, 300 170 C 260 160, 220 180, 190 160 Z" fill="url(#glass)"/>
  </g>

  <!-- middle: violet stack -->
  <g filter="url(#sh)">
    <g transform="translate(60 260) rotate(8) skewX(14)"><rect width="230" height="110" rx="18" fill="url(#p1)" opacity=".85"/><rect width="230" height="110" rx="18" fill="url(#dots)"/><rect width="230" height="110" rx="18" fill="url(#glass)"/></g>
    <g transform="translate(40 350) rotate(6) skewX(16)"><rect width="250" height="100" rx="18" fill="url(#p2)" opacity=".8"/><rect width="250" height="100" rx="18" fill="url(#glass)"/></g>
    <g transform="translate(120 440) rotate(-6) skewX(8)"><rect width="150" height="90" rx="14" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".9"/><rect width="150" height="90" rx="14" fill="url(#glass)"/></g>
    <g transform="translate(20 480) rotate(4) skewX(18)"><rect width="270" height="120" rx="18" fill="url(#p2)" opacity=".7"/><rect width="270" height="120" rx="18" fill="url(#dots)"/><rect width="270" height="120" rx="18" fill="url(#glass)"/></g>
    <g transform="translate(60 590) rotate(2) skewX(14)"><rect width="220" height="90" rx="16" fill="url(#p3)" opacity=".85"/><rect width="220" height="90" rx="16" fill="url(#glass)"/></g>
    <g transform="translate(140 650) rotate(-10) skewX(4)"><rect width="110" height="190" rx="16" fill="url(#p1)" opacity=".8"/><rect width="110" height="190" rx="16" fill="url(#grid)"/><rect width="110" height="190" rx="16" fill="url(#glass)"/></g>
    <g transform="translate(40 700) rotate(-4) skewX(6)"><rect width="90" height="220" rx="16" fill="url(#p2)" opacity=".75"/><rect width="90" height="220" rx="16" fill="url(#glass)"/></g>
    <ellipse cx="80" cy="930" rx="60" ry="72" fill="url(#pb)" opacity=".85"/>
    <ellipse cx="80" cy="930" rx="60" ry="72" fill="url(#glass)"/>
  </g>

  <!-- lower right: blue stack -->
  <g filter="url(#sh)">
    <g transform="translate(330 640) rotate(-6) skewX(-12)"><rect width="110" height="26" rx="6" fill="url(#b2)" opacity=".9"/><rect width="110" height="26" rx="6" fill="url(#glass)"/></g>
    <g transform="translate(320 680) rotate(-6) skewX(-12)"><rect width="110" height="26" rx="6" fill="url(#b1)" opacity=".85"/><rect width="110" height="26" rx="6" fill="url(#glass)"/></g>
    <g transform="translate(310 720) rotate(-6) skewX(-12)"><rect width="110" height="26" rx="6" fill="url(#b2)" opacity=".8"/><rect width="110" height="26" rx="6" fill="url(#glass)"/></g>
    <g transform="translate(300 760) rotate(-6) skewX(-12)"><rect width="110" height="26" rx="6" fill="url(#b1)" opacity=".75"/><rect width="110" height="26" rx="6" fill="url(#grid)"/><rect width="110" height="26" rx="6" fill="url(#glass)"/></g>
    <g transform="translate(290 800) rotate(-6) skewX(-12)"><rect width="110" height="26" rx="6" fill="url(#b2)" opacity=".7"/><rect width="110" height="26" rx="6" fill="url(#glass)"/></g>
  </g>
</svg>
